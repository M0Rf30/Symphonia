name: CI

on:
  push:
    branches:
      - master
      - main
      - rmpd-next
      - "rel-*"
      - "dev-*"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Check default features
        run: cargo check --all

      - name: Check all features
        run: cargo check --all --all-features

      - name: Check fuzzers
        run: cargo check --manifest-path symphonia/fuzz/Cargo.toml --verbose

      # A target without a [[bin]] entry is never built, and an entry without a source file does
      # not build: both must stay in sync.
      - name: Check fuzz targets are registered
        if: runner.os == 'Linux'
        run: |
          grep -A1 '^\[\[bin\]\]' symphonia/fuzz/Cargo.toml | sed -n 's/^name = "\(.*\)"$/\1/p' | sort > bins.txt
          ls symphonia/fuzz/fuzz_targets | sed 's/\.rs$//' | sort > files.txt
          diff -u bins.txt files.txt

  msrv:
    name: MSRV (1.85)

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install 1.85 --profile minimal && rustup default 1.85

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Check workspace
        run: cargo check --workspace

      - name: Check workspace (all features)
        run: cargo check --workspace --all-features

      # Tests too: they catch std APIs and language features newer than the MSRV that `check`
      # misses in test-only code.
      - name: Test workspace
        run: cargo test --workspace

      - name: Test workspace (all features)
        run: cargo test --workspace --all-features

  clippy:
    name: Clippy ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Check default features
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Check all features
        run: cargo clippy --all --all-targets --all-features -- -D warnings

  test:
    name: Test ${{ matrix.config.target }} on ${{ matrix.config.os }}

    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.config.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      # The ffmpeg reference tests skip silently when ffmpeg is missing. Installing it makes them
      # run, and REQUIRE_REFERENCES turns a missing reference into a failure for the helpers of
      # symphonia-testutil (`have_tool`, `require_reference`, `sample_path`, `open_sample`). Tests
      # that probe for ffmpeg on their own (`Command::new("ffmpeg")` with a local skip) are not
      # covered by it and still skip silently.
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Test default features
        run: cargo test --target ${{ matrix.config.target }} --all
        env:
          REQUIRE_REFERENCES: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Test all features
        run: cargo test --target ${{ matrix.config.target }} --all --all-features
        env:
          REQUIRE_REFERENCES: ${{ runner.os == 'Linux' && '1' || '' }}

  # Big-endian coverage. The decoders and bit readers are written for little-endian hosts first,
  # so byte-order bugs only show here. The scope is limited to the crates that read or convert raw
  # bytes, and it runs in release mode: QEMU user emulation makes an unoptimised build of the whole
  # workspace take far longer than the rest of CI together. `cross` is installed as a prebuilt
  # binary rather than compiled from source on every run.
  test-powerpc:
    name: Test (powerpc64, big-endian)

    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TARGET: powerpc64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: powerpc64

      - name: Test byte-order sensitive crates
        run: >
          cross test --release --target "$TARGET" --no-fail-fast
          -p symphonia-core
          -p symphonia-common
          -p symphonia-codec-pcm
          -p symphonia-codec-adpcm
          -p symphonia-bundle-flac
          -p symphonia-format-riff
          -p symphonia-codec-wavpack
          -p symphonia-bundle-ape

  # Release-mode tests: overflow checks are off and optimisations change float codegen, so decoder
  # hash tests are run here too.
  test-release:
    name: Test (release)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Test all features
        run: cargo test --release --all --all-features

  docs:
    name: Docs

    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Build docs
        run: cargo doc --no-deps --all --all-features

  fmt:
    name: Rustfmt

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # rustfmt.toml uses nightly-only options.
      - name: Setup Toolchain
        run: rustup install nightly --profile minimal && rustup default nightly && rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  deny:
    name: cargo-deny

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources

  typos:
    name: Typos

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.51.1

  # Every commit of a pull request must build on its own, otherwise `git bisect` lands on commits
  # that fail for unrelated reasons (e.g. a workspace member added in a later commit).
  commits:
    name: Build each commit
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request head rather than the merge commit, with the full history so that the
          # base..head range can be walked.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Check each commit
        run: .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  coverage:
    name: Coverage

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable --profile minimal -c llvm-tools-preview && rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2.9.2

      # symphonia-play has no tests and is a thin front end for the audio output, so it is left out
      # to keep it from diluting the figures.
      - name: Run tests with coverage
        run: cargo llvm-cov --no-report --workspace --all-features --exclude symphonia-play

      - name: Write reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html

  # Timings on shared runners are noisy: use them to spot order-of-magnitude regressions, not to
  # gate merges. The numbers are published in the job summary and as an artifact.
  bench:
    name: Benchmarks

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      # Every `[[bench]]` target in the workspace. They are Criterion harnesses (`harness = false`),
      # which accept these arguments; `cargo bench --benches` would also pass them to the libtest
      # harness of library crates, which rejects them.
      - name: Criterion benchmarks
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | .name as $pkg | .targets[] | select(.kind | index("bench")) | "\($pkg) \(.name)"' \
            | while read -r pkg bench; do
                cargo bench -p "$pkg" --bench "$bench" \
                  -- --warm-up-time 1 --measurement-time 3 --output-format bencher
              done | tee criterion.txt

      # Decode every fixture that is checked in. Each file is decoded 200 times and the minimum
      # time is reported, which keeps the very short fixtures stable.
      - name: Decode benchmark
        shell: bash
        run: >
          cargo run --release -p symphonia --features all --example decode_bench -- -n 200
          symphonia-bundle-mp3/tests/fixtures/*.mp3
          symphonia-bundle-musepack/tests/*.mpc
          symphonia-codec-ac3/tests/data/*.ac3
          symphonia-codec-ac3/tests/data/*.eac3
          symphonia-codec-dca/tests/data/*.dts
          symphonia-codec-truehd/tests/data/*.mlp
          symphonia-codec-truehd/tests/data/*.thd
          symphonia-codec-wavpack/tests/fixtures/*.wv
          symphonia-codec-opus/tests/data/*.opus
          | tee decode_bench.txt

      - name: Publish results
        run: |
          {
            echo '### Criterion'
            echo '```'
            cat criterion.txt
            echo '```'
            echo '### decode_bench'
            echo '```'
            cat decode_bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            criterion.txt
            decode_bench.txt
