name: CI

on:
  push:
    branches:
      - master
      - main
      - rmpd-next
      - "rel-*"
      - "dev-*"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check default features
        run: cargo check --all

      - name: Check all features
        run: cargo check --all --all-features --exclude symphonia-play

      - name: Check fuzzers
        run: cargo check --manifest-path symphonia/fuzz/Cargo.toml --verbose

  msrv:
    name: MSRV (1.85)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install 1.85 --profile minimal && rustup default 1.85

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check workspace
        run: cargo check --workspace

      - name: Check workspace (all features)
        run: cargo check --workspace --all-features --exclude symphonia-play

  clippy:
    name: Clippy ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check default features
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Check all features
        run: cargo clippy --all --all-targets --all-features --exclude symphonia-play -- -D warnings

  test:
    name: Test ${{ matrix.config.target }} on ${{ matrix.config.os }}

    env:
      CARGO: cargo

    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, use-cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, use-cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, use-cross: false }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.config.target }}

      - name: Setup Cross
        if: matrix.config.use-cross
        run: |
          cargo install cross --locked
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Test default features
        run: ${{ env.CARGO }} test ${{ matrix.config.args }} --target ${{ matrix.config.target }} --all --exclude symphonia-play

      - name: Test all features
        run: ${{ env.CARGO }} test ${{ matrix.config.args }} --target ${{ matrix.config.target }} --all --all-features --exclude symphonia-play

  # Release-mode tests: overflow checks are off and optimisations change float codegen, so decoder
  # hash tests are run here too.
  test-release:
    name: Test (release)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Test all features
        run: cargo test --release --all --all-features --exclude symphonia-play

  docs:
    name: Docs

    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Setup Toolchain
        run: rustup install stable && rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build docs
        run: cargo doc --no-deps --all --all-features --exclude symphonia-play

  fmt:
    name: Rustfmt

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # rustfmt.toml uses nightly-only options.
      - name: Setup Toolchain
        run: rustup install nightly --profile minimal && rustup default nightly && rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  deny:
    name: cargo-deny

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources

  typos:
    name: Typos

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.51.1
