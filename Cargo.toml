[workspace]
resolver = "2"

members = [
    "symphonia",
    "symphonia-bundle-ape",
    "symphonia-bundle-flac",
    "symphonia-bundle-mp3",
    "symphonia-bundle-musepack",
    "symphonia-codec-aac",
    "symphonia-codec-adpcm",
    "symphonia-codec-alac",
    "symphonia-codec-speex",
    "symphonia-codec-nellymoser",
    "symphonia-codec-imc",
    "symphonia-codec-gsm",
    "symphonia-codec-truespeech",
    "symphonia-codec-truehd",
    "symphonia-codec-dca",
    "symphonia-codec-ac3",
    "symphonia-codec-dsd",
    "symphonia-codec-opus",
    "symphonia-codec-pcm",
    "symphonia-codec-vorbis",
    "symphonia-codec-wavpack",
    "symphonia-common",
    "symphonia-core",
    "symphonia-format-dsd",
    "symphonia-format-es",
    "symphonia-format-flv",
    "symphonia-format-isomp4",
    "symphonia-format-mkv",
    "symphonia-format-mpegps",
    "symphonia-format-mpegts",
    "symphonia-format-ogg",
    "symphonia-format-riff",
    "symphonia-metadata",
    "symphonia-tagging",
    "symphonia-testutil",
    "symphonia-play",
    "symphonia-check",
]

[workspace.package]
edition = "2024"
homepage = "https://github.com/M0Rf30/Symphonia"
license = "MPL-2.0"
license-file = "LICENSE"
repository = "https://github.com/M0Rf30/Symphonia"
rust-version = "1.85"
version = "0.6.1"

[workspace.dependencies]
lazy_static = "1.4.0"
log = "0.4"
smallvec = "1.13.1"
symphonia-bundle-ape = { version = "0.6.1", path = "symphonia-bundle-ape", default-features = false }
symphonia-bundle-flac = { version = "0.6.1", path = "symphonia-bundle-flac", default-features = false }
symphonia-bundle-mp3 = { version = "0.6.1", path = "symphonia-bundle-mp3", default-features = false }
symphonia-bundle-musepack = { version = "0.6.1", path = "symphonia-bundle-musepack", default-features = false }
symphonia-codec-aac = { version = "0.6.1", path = "symphonia-codec-aac", default-features = false }
symphonia-codec-adpcm = { version = "0.6.1", path = "symphonia-codec-adpcm", default-features = false }
symphonia-codec-ac3 = { version = "0.6.1", path = "symphonia-codec-ac3", default-features = false }
symphonia-codec-dca = { version = "0.6.1", path = "symphonia-codec-dca", default-features = false }
symphonia-codec-truehd = { version = "0.6.1", path = "symphonia-codec-truehd", default-features = false }
symphonia-codec-nellymoser = { version = "0.6.1", path = "symphonia-codec-nellymoser", default-features = false }
symphonia-codec-imc = { version = "0.6.1", path = "symphonia-codec-imc", default-features = false }
symphonia-codec-truespeech = { version = "0.6.1", path = "symphonia-codec-truespeech", default-features = false }
symphonia-codec-speex = { version = "0.6.1", path = "symphonia-codec-speex", default-features = false }
symphonia-codec-alac = { version = "0.6.1", path = "symphonia-codec-alac", default-features = false }
symphonia-codec-dsd = { version = "0.6.1", path = "symphonia-codec-dsd", default-features = false }
symphonia-codec-opus = { version = "0.6.1", path = "symphonia-codec-opus", default-features = false }
symphonia-codec-pcm = { version = "0.6.1", path = "symphonia-codec-pcm", default-features = false }
symphonia-codec-vorbis = { version = "0.6.1", path = "symphonia-codec-vorbis", default-features = false }
symphonia-codec-wavpack = { version = "0.6.1", path = "symphonia-codec-wavpack", default-features = false }
symphonia-common = { version = "0.6.1", path = "symphonia-common", default-features = false }
symphonia-core = { version = "0.6.1", path = "symphonia-core", default-features = false }
symphonia-format-caf = { version = "0.6.1", path = "symphonia-format-caf", default-features = false }
symphonia-format-dsd = { version = "0.6.1", path = "symphonia-format-dsd", default-features = false }
symphonia-format-es = { version = "0.6.1", path = "symphonia-format-es", default-features = false }
symphonia-format-flv = { version = "0.6.1", path = "symphonia-format-flv", default-features = false }
symphonia-format-isomp4 = { version = "0.6.1", path = "symphonia-format-isomp4", default-features = false }
symphonia-format-mkv = { version = "0.6.1", path = "symphonia-format-mkv", default-features = false }
symphonia-format-mpegps = { version = "0.6.1", path = "symphonia-format-mpegps", default-features = false }
symphonia-format-mpegts = { version = "0.6.1", path = "symphonia-format-mpegts", default-features = false }
symphonia-format-ogg = { version = "0.6.1", path = "symphonia-format-ogg", default-features = false }
symphonia-format-riff = { version = "0.6.1", path = "symphonia-format-riff", default-features = false }
symphonia-metadata = { version = "0.6.1", path = "symphonia-metadata", default-features = false }
symphonia-testutil = { path = "symphonia-testutil" }
clap = "4.6.0"
pretty_env_logger = "0.5"

#cargo-features = ["profile-rustflags"]

[profile.profiling]
inherits = "release"
debug = true
#rustflags = ["-C", "force-frame-pointers=y"]

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
symphonia-codec-gsm = { version = "0.6.1", path = "symphonia-codec-gsm", default-features = false }
