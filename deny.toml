[graph]
all-features = true
exclude = ["symphonia-play"]

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
