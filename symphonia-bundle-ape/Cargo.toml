[package]
name = "symphonia-bundle-ape"
description = "Pure Rust Monkey's Audio (APE) demuxer and decoder (a part of project Symphonia)."
authors = ["OMBS.IO Dev Team <dev@ombs.io>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "ape", "monkeys-audio"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
symphonia-core = { version = "0.5.9", path = "../symphonia-core" }
ape-decoder = "0.3.2"

[lints]
workspace = true
