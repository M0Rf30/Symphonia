[package]
name = "symphonia-codec-aac"
description = "Pure Rust AAC decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>", "Kostya Shishkov <kostya.shiskov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "aac", "m4a"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
lazy_static = { workspace = true }
symphonia-core = { version = "0.6.1", path = "../symphonia-core" }
symphonia-common = { version = "0.6.1", path = "../symphonia-common" }

[features]
# Compute the complex QMF banks of SBR with an FFT instead of matrix products: much faster, and the
# output differs from that of the matrix products by rounding errors of the double precision
# arithmetic (far below the precision of the 32-bit output, but not bit for bit).
sbr-fft-qmf = []

[dev-dependencies]
symphonia-format-isomp4 = { version = "0.6.1", path = "../symphonia-format-isomp4" }

[lints]
workspace = true
