[package]
name = "symphonia-codec-siren"
description = "Pure Rust Siren (G.722.1) and MSN Siren decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "siren", "g722"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
symphonia-core = { workspace = true }

[dev-dependencies]
symphonia-format-riff = { workspace = true, features = ["wav"] }
symphonia-testutil = { workspace = true }

[lints]
workspace = true
