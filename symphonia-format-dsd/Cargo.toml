[package]
name = "symphonia-format-dsd"
description = "Pure Rust DSD (DSF/DFF) demuxer (a part of project Symphonia)."
authors = ["M0Rf30 <morf3089@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "media", "demuxer", "dsd", "dsf"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
symphonia-core = { version = "0.6.0", path = "../symphonia-core" }
symphonia-metadata = { version = "0.6.0", path = "../symphonia-metadata", features = ["riff-id3"] }

[lints]
workspace = true