[package]
name = "symphonia-format-mkv"
description = "Pure Rust MKV/WebM demuxer (a part of project Symphonia)."
authors = ["Dariusz Niedoba <dariusz.niedoba@gmail.com>", "Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["media", "demuxer", "mkv", "matroska", "webm"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
lazy_static = { workspace = true }
symphonia-core = { workspace = true }
symphonia-common = { workspace = true }
symphonia-metadata = { workspace = true }

[dev-dependencies]
symphonia-testutil = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-codec-wavpack = { workspace = true }

[lints]
workspace = true
