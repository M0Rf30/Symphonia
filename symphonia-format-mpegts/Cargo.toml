[package]
name = "symphonia-format-mpegts"
description = "Pure Rust MPEG transport stream (audio-only) demuxer (a part of project Symphonia)."
authors = ["M0Rf30 <morf3089@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "media", "demuxer", "mpegts"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
symphonia-codec-aac = { workspace = true }
log = { workspace = true }
symphonia-common = { workspace = true }
symphonia-core = { workspace = true }

[dev-dependencies]
symphonia-testutil = { workspace = true }
symphonia-bundle-mp3 = { workspace = true, features = ["mp1", "mp2", "mp3"] }
symphonia-codec-dca = { workspace = true }
symphonia-codec-opus = { workspace = true }
symphonia-codec-truehd = { workspace = true }
symphonia-format-ogg = { workspace = true }

[lints]
workspace = true
