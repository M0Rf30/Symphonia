[package]
name = "symphonia-format-ogg"
description = "Pure Rust OGG demuxer and minimal page writer (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "media", "demuxer", "ogg"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { workspace = true }
symphonia-core = { workspace = true }
symphonia-common = { workspace = true }

[dependencies.symphonia-metadata]
workspace = true
features = ["vorbis"]

[features]
default = []
# A minimal Ogg page writer (`symphonia_format_ogg::writer`).
writer = []

[lints]
workspace = true
