[package]
name = "symphonia"
description = "Pure Rust media container and audio decoding library."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding", "multimedia::video"]
keywords = ["audio", "codec", "decoder", "multimedia", "media"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Show documentation with all features enabled on docs.rs
[package.metadata.docs.rs]
all-features = true

[features]
# Only royalty-free open standard codecs and formats are enabled by default. Opus (RFC 6716) is
# royalty-free per the IETF IPR disclosures referenced in symphonia-codec-opus's NOTICE, so it
# belongs here alongside Vorbis/FLAC now that its native decoder is RFC 8251 conformant.
default = ["opt-simd", "all-meta", "adpcm", "flac", "mkv", "ogg", "opus", "pcm", "vorbis", "wav"]

# Feature flags to enable specific codecs, container, and standalone metadata formats.
aac = ["dep:symphonia-codec-aac"]
# Compute the complex QMF banks of SBR with an FFT: faster, but not bit for bit identical.
aac-sbr-fft-qmf = ["aac", "symphonia-codec-aac/sbr-fft-qmf"]
adpcm = ["dep:symphonia-codec-adpcm"]
alac = ["dep:symphonia-codec-alac"]
ape-format = ["dep:symphonia-bundle-ape"]
dsd = ["dep:symphonia-codec-dsd", "dep:symphonia-format-dsd"]
flac = ["dep:symphonia-bundle-flac"]
caf = ["dep:symphonia-format-caf"]
flv = ["dep:symphonia-format-flv"]
isomp4 = ["dep:symphonia-format-isomp4"]
mkv = ["dep:symphonia-format-mkv"]
mpegps = ["dep:symphonia-format-mpegps"]
mpegts = ["dep:symphonia-format-mpegts"]
musepack = ["dep:symphonia-bundle-musepack"]
mp1 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp1"]
mp2 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp2"]
mp3 = ["dep:symphonia-bundle-mp3", "symphonia-bundle-mp3/mp3"]
ogg = ["dep:symphonia-format-ogg"]
opus = ["dep:symphonia-codec-opus"]
pcm = ["dep:symphonia-codec-pcm"]
aiff = ["dep:symphonia-format-riff", "symphonia-format-riff/aiff"]
vorbis = ["dep:symphonia-codec-vorbis"]
wav = ["dep:symphonia-format-riff", "symphonia-format-riff/wav"]
wavpack = ["dep:symphonia-codec-wavpack"]
ape = ["symphonia-metadata/ape"]
id3v1 = ["symphonia-metadata/id3v1"]
id3v2 = ["symphonia-metadata/id3v2"]

# MPEG audio codecs.
mpa = ["mp1", "mp2", "mp3"]

# Enable all supported codecs.
all-codecs = [
    "aac",
    "adpcm",
    "alac",
    "dsd",
    "flac",
    "mp1",
    "mp2",
    "mp3",
    "musepack",
    "opus",
    "pcm",
    "vorbis",
    "wavpack",
]

# Enable all supported container formats.
all-formats = [
    "caf",
    "ape-format",
    "dsd",
    "flv",
    "isomp4",
    "mkv",
    "mpegps",
    "mpegts",
    "musepack",
    "ogg",
    "aiff",
    "wav",
]

# Enable all supported standalone metadata formats.
all-meta = [
    "ape",
    "id3v1",
    "id3v2",
]

# Enable all supported codecs and formats.
all = [
    "all-codecs",
    "all-formats",
    "all-meta",
]

# SIMD support.
opt-simd-sse = ["symphonia-core/opt-simd-sse"]
opt-simd-avx = ["symphonia-core/opt-simd-avx"]
opt-simd-neon = ["symphonia-core/opt-simd-neon"]

# Enable all SIMD support.
opt-simd = [
    "opt-simd-sse",
    "opt-simd-avx",
    "opt-simd-neon",
]

# Experimental features.
exp-subtitle-codecs = ["symphonia-core/exp-subtitle-codecs"]
exp-video-codecs = ["symphonia-core/exp-video-codecs"]

[dependencies]
lazy_static = { workspace = true }

[dependencies.symphonia-core]
workspace = true

[dependencies.symphonia-metadata]
workspace = true

[dependencies.symphonia-bundle-ape]
workspace = true
optional = true

[dependencies.symphonia-codec-wavpack]
workspace = true
optional = true

[dependencies.symphonia-bundle-flac]
workspace = true
optional = true

[dependencies.symphonia-bundle-musepack]
workspace = true
optional = true
[dependencies.symphonia-bundle-mp3]
workspace = true
optional = true

[dependencies.symphonia-codec-aac]
workspace = true
optional = true

[dependencies.symphonia-codec-adpcm]
workspace = true
optional = true

[dependencies.symphonia-codec-alac]
workspace = true
optional = true

[dependencies.symphonia-codec-dsd]
workspace = true
optional = true

[dependencies.symphonia-codec-pcm]
workspace = true
optional = true

[dependencies.symphonia-codec-vorbis]
workspace = true
optional = true

[dependencies.symphonia-codec-opus]
workspace = true
optional = true

[dependencies.symphonia-format-riff]
workspace = true
optional = true

[dependencies.symphonia-format-ogg]
workspace = true
optional = true

[dependencies.symphonia-format-isomp4]
workspace = true
optional = true

[dependencies.symphonia-format-mkv]
workspace = true
optional = true

[dependencies.symphonia-format-caf]
workspace = true
optional = true

[dependencies.symphonia-format-dsd]
workspace = true
optional = true

[dependencies.symphonia-format-flv]
workspace = true
optional = true

[dependencies.symphonia-format-mpegps]
workspace = true
optional = true

[dependencies.symphonia-format-mpegts]
workspace = true
optional = true

[dev-dependencies]
symphonia-testutil = { workspace = true }

[lints]
workspace = true
